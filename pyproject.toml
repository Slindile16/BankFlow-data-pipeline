[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankflow"
version = "0.1.0"
description = "An ETL pipeline for fictional banking data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avoid sharing cache files between terminal and automated runs on Windows.
addopts = "-p no:cacheprovider"
